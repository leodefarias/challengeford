services:

  # ── Nginx reverse proxy (TLS 1.2/1.3, HTTP→HTTPS redirect) ─────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ford-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8082:8082"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./mobile/dist:/usr/share/nginx/html:ro
    depends_on:
      java-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Microsserviço IA (Python FastAPI + ChromaDB) ──────────────────
  python-ia:
    build:
      context: ./microsservico-ia
      dockerfile: Dockerfile
    container_name: ford-python-ia
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      CHROMA_PERSIST_DIR: /app/data/chromadb
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - chroma_data:/app/data/chromadb
      - ./microsservico-ia/data/validated:/app/data/validated
      - ./microsservico-ia/data/seed:/app/data/seed:ro
      - ./microsservico-ia/data/pdfs:/app/data/pdfs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  # ── API Java Spring Boot (conecta no Oracle FIAP remoto) ──────────
  java-api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: ford-java-api
    ports:
      - "8080:8080"
    environment:
      ORACLE_URL: ${ORACLE_URL}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      PYTHON_SERVICE_URL: http://python-ia:8000
      JWT_SECRET: ${JWT_SECRET}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      FORD_ADMIN_PASSWORD: ${FORD_ADMIN_PASSWORD}
    depends_on:
      python-ia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Túnel público da demo (só com: docker compose --profile demo up) ──
  demo-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ford-demo-tunnel
    # http2 = TCP 7844 (QUIC/UDP 7844 often blocked). If 7844 TCP also
    # blocked, start.sh falls back to a 443 SSH tunnel (Pinggy).
    command: tunnel --no-autoupdate --protocol http2 --url http://nginx:8082
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    profiles:
      - demo

volumes:
  chroma_data:
    name: ford_chromadb
