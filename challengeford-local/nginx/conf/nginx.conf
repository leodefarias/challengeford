events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Demo public gateway — Cloudflare Quick Tunnel terminates TLS.
    # App (Expo web export) + /api on the same origin so phones work on 4G.
    server {
        listen 8082;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        location /api/ {
            proxy_pass         http://java-api:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Browser same-origin still sends Origin; Spring CORS whitelist is localhost-only
            # and rejects the Cloudflare host with 403 Invalid CORS request.
            proxy_set_header   Origin "";
            proxy_read_timeout 120s;
            client_max_body_size 20m;
        }

        location /actuator/health {
            proxy_pass http://java-api:8080/actuator/health;
        }

        location / {
            # Do not use $uri/ — it matches the html dir and returns 403
            # (directory index forbidden) instead of serving index.html.
            try_files $uri /index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Proxy para Java API
        location /api/ {
            proxy_pass         http://java-api:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /actuator/health {
            proxy_pass http://java-api:8080/actuator/health;
        }
    }
}
