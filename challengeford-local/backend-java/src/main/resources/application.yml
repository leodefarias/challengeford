spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.jdbc.time_zone: America/Sao_Paulo

app:
  python-service-url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    rsa-private-key: ${RSA_PRIVATE_KEY:}
    rsa-public-key: ${RSA_PUBLIC_KEY:}
    expiration-hours: 8
  encryption:
    key: ${ENCRYPTION_KEY}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    br.ford.catalog: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
