name: DevSecOps

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

defaults:
  run:
    working-directory: .

jobs:
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sca-java:
    name: SCA (Maven dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: challengeford-local/backend-java/pom.xml
      - name: OWASP Dependency-Check
        working-directory: challengeford-local/backend-java
        run: |
          mvn -B -q org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=9 \
            -Dformat=HTML \
            -DprettyPrint=true || true
      - name: Dependency tree (evidence)
        working-directory: challengeford-local/backend-java
        run: mvn -B -q dependency:tree -Dverbose=false

  sca-npm:
    name: SCA (npm audit mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: challengeford-local/mobile/package-lock.json
      - name: npm ci
        working-directory: challengeford-local/mobile
        run: npm ci
      - name: npm audit (high+)
        working-directory: challengeford-local/mobile
        run: npm audit --audit-level=high
        continue-on-error: true

  sast-and-tests:
    name: SAST (Semgrep) + Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OWASP
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: challengeford-local/backend-java/pom.xml
      - name: Unit + MockMvc tests
        working-directory: challengeford-local/backend-java
        run: mvn -B test

  container-security:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (repo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: challengeford-local
          severity: CRITICAL
          exit-code: "1"
      - name: Trivy config Dockerfiles
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: challengeford-local
          severity: CRITICAL
          exit-code: "1"
      - name: Trivy HIGH (advisory)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: challengeford-local
          severity: HIGH
          exit-code: "0"
